<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="images/favicon.png" />

    <title>Who Is Sakib Ibrahim? | Interactive Portfolio</title>

    <meta
      name="description"
      content="Explore the interactive portfolio of Sakib Ibrahim, a BIM Coordinator and Software Development student combining technology, design, and development through an RPG-inspired experience."
    />

    <!-- Shared Website CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="title-screen">
    <main class="title-screen-container">
      <!-- ========================================
           Title Screen
      ========================================= -->

      <section id="title-screen-content">
        <h1>Who Is Sakib Ibrahim?</h1>

        <button
          id="press-start-button"
          class="press-start-button"
          type="button"
          aria-controls="loading-screen"
        >
          ▶ Press Start ◀
        </button>

        <p class="version-text">
          <em>Portfolio Edition</em><br />
          <span>Press Start to Explore</span>
        </p>
      </section>

      <!-- ========================================
           Loading Screen
           Hidden until Press Start is selected.
      ========================================= -->

      <section
        id="loading-screen"
        class="loading-screen hidden"
        aria-live="polite"
      >
        <h2>Initializing Portfolio...</h2>

        <div
          class="loading-bar-container"
          role="progressbar"
          aria-label="Portfolio loading progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="loading-bar" class="loading-bar"></div>
        </div>

        <p id="loading-percent">0%</p>

        <p id="loading-status">Preparing Systems...</p>
      </section>
    </main>

    <!-- Shared JavaScript -->
    <script src="js/script.js"></script>
  </body>
</html>
